[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "benchprime"
version = "0.1.0.dev6"
description = "Evaluation creation for user-defined purposes and use cases"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
office = ["openpyxl>=3.1", "python-docx>=1.1"]

[project.scripts]
benchprime = "benchprime.cli:main"

[tool.setuptools]
packages = ["benchprime"]

[tool.setuptools.package-data]
benchprime = ["patterns/*.json", "templates/*.md"]
