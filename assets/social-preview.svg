<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
<title id="title">Create evals from your task and source material.</title><desc id="description">BenchPrime illustrates why a proposal and an accepted commitment need different expected answers.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#17324d"/></marker></defs>
<rect width="1280" height="640" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="60" y="92" font-size="52" font-weight="600" fill="#17324d" text-anchor="start" data-max-width="1160">
<tspan x="60" y="92">Create evals from your</tspan>
<tspan x="60" y="159">task and source material.</tspan>
</text>
<text x="60" y="220" font-size="41" font-weight="400" fill="#17324d" text-anchor="start" data-max-width="1160">
<tspan x="60" y="220">&quot;Could we send it Friday?&quot;</tspan>
</text>
<text x="60" y="285" font-size="30" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="1160">
<tspan x="60" y="285">A proposal: leave it out under the example policy.</tspan>
</text>
<text x="60" y="390" font-size="41" font-weight="600" fill="#17324d" text-anchor="start" data-max-width="1160">
<tspan x="60" y="390">&quot;I&#x27;ll send it Friday.&quot;</tspan>
</text>
<text x="60" y="455" font-size="30" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="1160">
<tspan x="60" y="455">A commitment: include it.</tspan>
</text>
<path d="M60 525H1220" fill="none" stroke="#8b9aa8" stroke-width="1"/>
<text x="60" y="585" font-size="27" font-weight="400" fill="#17324d" text-anchor="start" data-max-width="1160">
<tspan x="60" y="585">BenchPrime | Fictional authored example | No target run</tspan>
</text>
</g></svg>