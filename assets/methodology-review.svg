<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="696" viewBox="0 0 1080 696" role="img" aria-labelledby="title description">
<title id="title">Your rubric needs tests too.</title><desc id="description">Illustrative review matrix scoped to one requirement. A response can satisfy this requirement while failing another. Test whether this criterion rejects a response that meets its requirement or passes one that violates it. These review probes contain no measured target performance.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#17324d"/></marker></defs>
<rect width="1080" height="696" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="48" y="64" font-size="36" font-weight="600" fill="#17324d" text-anchor="start" data-max-width="984">
<tspan x="48" y="64">Your rubric needs tests too.</tspan>
</text>
<text x="48" y="102" font-size="21" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="984">
<tspan x="48" y="102">Judge each response against the requirement this check covers.</tspan>
</text>
<rect x="650" y="204" width="350" height="140" fill="#edf1f4"/>
<rect x="300" y="344" width="350" height="140" fill="#edf1f4"/>
<path d="M300 204H1000" fill="none" stroke="#8b9aa8" stroke-width="1"/>
<path d="M300 204V484" fill="none" stroke="#8b9aa8" stroke-width="1"/>
<path d="M300 344H1000" fill="none" stroke="#8b9aa8" stroke-width="1"/>
<path d="M650 204V484" fill="none" stroke="#8b9aa8" stroke-width="1"/>
<path d="M300 484H1000" fill="none" stroke="#8b9aa8" stroke-width="1"/>
<path d="M1000 204V484" fill="none" stroke="#8b9aa8" stroke-width="1"/>
<text x="650" y="150" font-size="20" font-weight="400" fill="#485b6d" text-anchor="middle" data-max-width="700">
<tspan x="650" y="150">Proposed check</tspan>
</text>
<text x="475.0" y="186" font-size="24" font-weight="600" fill="#17324d" text-anchor="middle" data-max-width="300">
<tspan x="475.0" y="186">Pass</tspan>
</text>
<text x="825.0" y="186" font-size="24" font-weight="600" fill="#17324d" text-anchor="middle" data-max-width="300">
<tspan x="825.0" y="186">Fail</tspan>
</text>
<text x="48" y="268" font-size="25" font-weight="600" fill="#17324d" text-anchor="start" data-max-width="220">
<tspan x="48" y="268">Meets the</tspan>
<tspan x="48" y="300">requirement</tspan>
</text>
<text x="48" y="408" font-size="25" font-weight="600" fill="#17324d" text-anchor="start" data-max-width="220">
<tspan x="48" y="408">Violates the</tspan>
<tspan x="48" y="440">requirement</tspan>
</text>
<text x="475.0" y="284" font-size="24" font-weight="400" fill="#17324d" text-anchor="middle" data-max-width="310">
<tspan x="475.0" y="284">Expected pass</tspan>
</text>
<text x="825.0" y="272" font-size="25" font-weight="600" fill="#17324d" text-anchor="middle" data-max-width="310">
<tspan x="825.0" y="272">Wrong rejection</tspan>
</text>
<text x="825.0" y="311" font-size="18" font-weight="400" fill="#485b6d" text-anchor="middle" data-max-width="310">
<tspan x="825.0" y="311">Inspect the criterion</tspan>
</text>
<text x="475.0" y="412" font-size="25" font-weight="600" fill="#17324d" text-anchor="middle" data-max-width="310">
<tspan x="475.0" y="412">Missed error</tspan>
</text>
<text x="475.0" y="451" font-size="18" font-weight="400" fill="#485b6d" text-anchor="middle" data-max-width="310">
<tspan x="475.0" y="451">Inspect the criterion</tspan>
</text>
<text x="825.0" y="424" font-size="24" font-weight="400" fill="#17324d" text-anchor="middle" data-max-width="310">
<tspan x="825.0" y="424">Expected fail</tspan>
</text>
<text x="48" y="542" font-size="23" font-weight="400" fill="#17324d" text-anchor="start" data-max-width="984">
<tspan x="48" y="542">Challenge this requirement with valid alternatives and targeted mistakes.</tspan>
</text>
<text x="48" y="580" font-size="20" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="984">
<tspan x="48" y="580">Other requirements need their own checks.</tspan>
</text>
<text x="48" y="618" font-size="20" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="984">
<tspan x="48" y="618">Keep uncertain applicability unresolved.</tspan>
</text>
<text x="48" y="660" font-size="18" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="984">
<tspan x="48" y="660">Illustrative review outcomes. No performance measurement.</tspan>
</text>
</g></svg>