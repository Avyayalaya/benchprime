<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="621" viewBox="0 0 1080 621" role="img" aria-labelledby="title description">
<title id="title">Useful tests separate variation from failure.</title><desc id="description">Two authored meeting-actions contrasts: changing the wording of a valid task can preserve its acceptability; changing a proposal to an explicit commitment changes the required action. Check the remaining task requirements too.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#17324d"/></marker></defs>
<rect width="1080" height="621" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="48" y="64" font-size="36" font-weight="600" fill="#17324d" text-anchor="start" data-max-width="984">
<tspan x="48" y="64">Useful tests separate variation from failure.</tspan>
</text>
<text x="48" y="102" font-size="21" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="984">
<tspan x="48" y="102">Hold the task steady. Change one meaningful thing.</tspan>
</text>
<text x="48" y="182" font-size="26" font-weight="600" fill="#17324d" text-anchor="start" data-max-width="984">
<tspan x="48" y="182">Different wording</tspan>
</text>
<text x="48" y="239" font-size="28" font-weight="400" fill="#17324d" text-anchor="start" data-max-width="430">
<tspan x="48" y="239">Check the cost figures.</tspan>
</text>
<path d="M501 229H570" fill="none" stroke="#17324d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="620" y="239" font-size="28" font-weight="400" fill="#17324d" text-anchor="start" data-max-width="412">
<tspan x="620" y="239">Verify the cost figures.</tspan>
</text>
<text x="48" y="293" font-size="22" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="984">
<tspan x="48" y="293">The same task can be satisfied by either wording.</tspan>
</text>
<path d="M48 344H1032" fill="none" stroke="#8b9aa8" stroke-width="1"/>
<text x="48" y="394" font-size="26" font-weight="600" fill="#17324d" text-anchor="start" data-max-width="984">
<tspan x="48" y="394">A different commitment</tspan>
</text>
<text x="48" y="451" font-size="28" font-weight="400" fill="#17324d" text-anchor="start" data-max-width="430">
<tspan x="48" y="451">Could we send it Friday?</tspan>
</text>
<path d="M501 441H570" fill="none" stroke="#17324d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="620" y="451" font-size="28" font-weight="400" fill="#17324d" text-anchor="start" data-max-width="412">
<tspan x="620" y="451">I&#x27;ll send it Friday.</tspan>
</text>
<text x="48" y="505" font-size="22" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="984">
<tspan x="48" y="505">A proposal becomes a commitment. The required action changes.</tspan>
</text>
<path d="M48 550H1032" fill="none" stroke="#8b9aa8" stroke-width="1"/>
<text x="48" y="585" font-size="19" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="984">
<tspan x="48" y="585">Authored meeting-actions contrasts; check the rest of the task too.</tspan>
</text>
</g></svg>