<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="633" viewBox="0 0 1080 633" role="img" aria-labelledby="title description">
<title id="title">Start with the decision the eval must support.</title><desc id="description">Design backward from a decision to needed evidence, then to cases and criteria. The meeting-actions example illustrates the relationship; target execution and grading remain separate from BenchPrime&#x27;s local file tools.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#17324d"/></marker></defs>
<rect width="1080" height="633" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="48" y="64" font-size="36" font-weight="600" fill="#17324d" text-anchor="start" data-max-width="984">
<tspan x="48" y="64">Start with the decision the eval must support.</tspan>
</text>
<text x="48" y="102" font-size="21" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="984">
<tspan x="48" y="102">Work backward from the choice to the tests.</tspan>
</text>
<text x="48" y="189" font-size="30" font-weight="600" fill="#17324d" text-anchor="start" data-max-width="260">
<tspan x="48" y="189">Decision</tspan>
</text>
<text x="48" y="253" font-size="25" font-weight="400" fill="#17324d" text-anchor="start" data-max-width="260">
<tspan x="48" y="253">What would make you</tspan>
<tspan x="48" y="285">choose differently?</tspan>
</text>
<path d="M48 339H308" fill="none" stroke="#8b9aa8" stroke-width="1"/>
<text x="48" y="388" font-size="23" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="260">
<tspan x="48" y="388">Can we trust the</tspan>
<tspan x="48" y="417">action list?</tspan>
</text>
<path d="M329 179H377" fill="none" stroke="#17324d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="410" y="189" font-size="30" font-weight="600" fill="#17324d" text-anchor="start" data-max-width="260">
<tspan x="410" y="189">Evidence</tspan>
</text>
<text x="410" y="253" font-size="25" font-weight="400" fill="#17324d" text-anchor="start" data-max-width="260">
<tspan x="410" y="253">What evidence would</tspan>
<tspan x="410" y="285">justify that choice?</tspan>
</text>
<path d="M410 339H670" fill="none" stroke="#8b9aa8" stroke-width="1"/>
<text x="410" y="388" font-size="23" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="260">
<tspan x="410" y="388">Accepted commitments,</tspan>
<tspan x="410" y="417">without invented ones.</tspan>
</text>
<path d="M691 179H739" fill="none" stroke="#17324d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="772" y="189" font-size="30" font-weight="600" fill="#17324d" text-anchor="start" data-max-width="260">
<tspan x="772" y="189">Tests</tspan>
</text>
<text x="772" y="253" font-size="25" font-weight="400" fill="#17324d" text-anchor="start" data-max-width="260">
<tspan x="772" y="253">Which tests could</tspan>
<tspan x="772" y="285">produce that</tspan>
<tspan x="772" y="317">evidence?</tspan>
</text>
<path d="M772 339H1032" fill="none" stroke="#8b9aa8" stroke-width="1"/>
<text x="772" y="388" font-size="23" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="260">
<tspan x="772" y="388">Contrast a proposal</tspan>
<tspan x="772" y="417">with a commitment.</tspan>
</text>
<text x="48" y="488" font-size="18" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="984">
<tspan x="48" y="488">Meeting-actions illustration</tspan>
</text>
<path d="M48 518H1032" fill="none" stroke="#8b9aa8" stroke-width="1"/>
<text x="48" y="559" font-size="23" font-weight="400" fill="#17324d" text-anchor="start" data-max-width="984">
<tspan x="48" y="559">A plan describes coverage. Actual responses supply evidence.</tspan>
</text>
<text x="48" y="597" font-size="19" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="984">
<tspan x="48" y="597">Run and grade with your own approved process.</tspan>
</text>
</g></svg>