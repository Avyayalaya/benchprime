<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1005" viewBox="0 0 440 1005" role="img" aria-labelledby="title description">
<title id="title">Start with the decision the eval must support.</title><desc id="description">Design backward from a decision to needed evidence, then to cases and criteria. The meeting-actions example illustrates the relationship; target execution and grading remain separate from BenchPrime&#x27;s local file tools.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#17324d"/></marker></defs>
<rect width="440" height="1005" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="32" y="52" font-size="29" font-weight="600" fill="#17324d" text-anchor="start" data-max-width="376">
<tspan x="32" y="52">Start with the decision</tspan>
<tspan x="32" y="89">the eval must support.</tspan>
</text>
<text x="32" y="127" font-size="18" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="376">
<tspan x="32" y="127">Work backward from the choice to the</tspan>
<tspan x="32" y="150">tests.</tspan>
</text>
<text x="32" y="184" font-size="17" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="376">
<tspan x="32" y="184">Meeting-actions illustration</tspan>
</text>
<text x="32" y="235" font-size="28" font-weight="600" fill="#17324d" text-anchor="start" data-max-width="376">
<tspan x="32" y="235">Decision</tspan>
</text>
<text x="32" y="275" font-size="21" font-weight="400" fill="#17324d" text-anchor="start" data-max-width="376">
<tspan x="32" y="275">What would make you</tspan>
<tspan x="32" y="302">choose differently?</tspan>
</text>
<text x="32" y="338" font-size="20" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="376">
<tspan x="32" y="338">Can we trust the action list?</tspan>
</text>
<path d="M48 361V412" fill="none" stroke="#17324d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="32" y="445" font-size="28" font-weight="600" fill="#17324d" text-anchor="start" data-max-width="376">
<tspan x="32" y="445">Evidence</tspan>
</text>
<text x="32" y="485" font-size="21" font-weight="400" fill="#17324d" text-anchor="start" data-max-width="376">
<tspan x="32" y="485">What evidence would</tspan>
<tspan x="32" y="512">justify that choice?</tspan>
</text>
<text x="32" y="548" font-size="20" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="376">
<tspan x="32" y="548">Accepted commitments,</tspan>
<tspan x="32" y="574">without invented ones.</tspan>
</text>
<path d="M48 597V622" fill="none" stroke="#17324d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="32" y="655" font-size="28" font-weight="600" fill="#17324d" text-anchor="start" data-max-width="376">
<tspan x="32" y="655">Tests</tspan>
</text>
<text x="32" y="695" font-size="21" font-weight="400" fill="#17324d" text-anchor="start" data-max-width="376">
<tspan x="32" y="695">Which tests could</tspan>
<tspan x="32" y="722">produce that evidence?</tspan>
</text>
<text x="32" y="758" font-size="20" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="376">
<tspan x="32" y="758">Contrast a proposal</tspan>
<tspan x="32" y="784">with a commitment.</tspan>
</text>
<path d="M32 840H408" fill="none" stroke="#8b9aa8" stroke-width="1"/>
<text x="32" y="875" font-size="20" font-weight="400" fill="#17324d" text-anchor="start" data-max-width="376">
<tspan x="32" y="875">A plan describes coverage.</tspan>
<tspan x="32" y="901">Actual responses supply evidence.</tspan>
</text>
<text x="32" y="946" font-size="18" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="376">
<tspan x="32" y="946">Run and grade with your own approved</tspan>
<tspan x="32" y="969">process.</tspan>
</text>
</g></svg>