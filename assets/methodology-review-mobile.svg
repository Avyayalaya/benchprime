<svg xmlns="http://www.w3.org/2000/svg" width="440" height="924" viewBox="0 0 440 924" role="img" aria-labelledby="title description">
<title id="title">Your rubric needs tests too.</title><desc id="description">Illustrative review matrix scoped to one requirement. A response can satisfy this requirement while failing another. Test whether this criterion rejects a response that meets its requirement or passes one that violates it. These review probes contain no measured target performance.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#17324d"/></marker></defs>
<rect width="440" height="924" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="32" y="52" font-size="29" font-weight="600" fill="#17324d" text-anchor="start" data-max-width="376">
<tspan x="32" y="52">Your rubric needs tests</tspan>
<tspan x="32" y="89">too.</tspan>
</text>
<text x="32" y="127" font-size="18" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="376">
<tspan x="32" y="127">Judge each response against the</tspan>
<tspan x="32" y="150">requirement this check covers.</tspan>
</text>
<rect x="280" y="258" width="128" height="150" fill="#edf1f4"/>
<rect x="152" y="408" width="128" height="150" fill="#edf1f4"/>
<path d="M152 258H408" fill="none" stroke="#8b9aa8" stroke-width="1"/>
<path d="M152 258V558" fill="none" stroke="#8b9aa8" stroke-width="1"/>
<path d="M152 408H408" fill="none" stroke="#8b9aa8" stroke-width="1"/>
<path d="M280 258V558" fill="none" stroke="#8b9aa8" stroke-width="1"/>
<path d="M152 558H408" fill="none" stroke="#8b9aa8" stroke-width="1"/>
<path d="M408 258V558" fill="none" stroke="#8b9aa8" stroke-width="1"/>
<text x="280" y="204" font-size="18" font-weight="400" fill="#485b6d" text-anchor="middle" data-max-width="250">
<tspan x="280" y="204">Proposed check</tspan>
</text>
<text x="216.0" y="240" font-size="22" font-weight="600" fill="#17324d" text-anchor="middle" data-max-width="120">
<tspan x="216.0" y="240">Pass</tspan>
</text>
<text x="344.0" y="240" font-size="22" font-weight="600" fill="#17324d" text-anchor="middle" data-max-width="120">
<tspan x="344.0" y="240">Fail</tspan>
</text>
<text x="24" y="322" font-size="19" font-weight="600" fill="#17324d" text-anchor="start" data-max-width="110">
<tspan x="24" y="322">Meets</tspan>
<tspan x="24" y="346">requirement</tspan>
</text>
<text x="24" y="472" font-size="19" font-weight="600" fill="#17324d" text-anchor="start" data-max-width="110">
<tspan x="24" y="472">Violates</tspan>
<tspan x="24" y="496">requirement</tspan>
</text>
<text x="216.0" y="338" font-size="19" font-weight="400" fill="#17324d" text-anchor="middle" data-max-width="116">
<tspan x="216.0" y="338">Expected</tspan>
</text>
<text x="344.0" y="320" font-size="20" font-weight="600" fill="#17324d" text-anchor="middle" data-max-width="116">
<tspan x="344.0" y="320">Wrong</tspan>
<tspan x="344.0" y="346">rejection</tspan>
</text>
<text x="216.0" y="470" font-size="20" font-weight="600" fill="#17324d" text-anchor="middle" data-max-width="116">
<tspan x="216.0" y="470">Missed</tspan>
<tspan x="216.0" y="496">error</tspan>
</text>
<text x="344.0" y="488" font-size="19" font-weight="400" fill="#17324d" text-anchor="middle" data-max-width="116">
<tspan x="344.0" y="488">Expected</tspan>
</text>
<text x="32" y="616" font-size="21" font-weight="400" fill="#17324d" text-anchor="start" data-max-width="376">
<tspan x="32" y="616">Challenge this requirement with</tspan>
<tspan x="32" y="643">valid alternatives and targeted</tspan>
<tspan x="32" y="670">mistakes.</tspan>
</text>
<text x="32" y="720" font-size="19" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="376">
<tspan x="32" y="720">Other requirements need their own</tspan>
<tspan x="32" y="744">checks.</tspan>
</text>
<text x="32" y="794" font-size="19" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="376">
<tspan x="32" y="794">Keep uncertain applicability</tspan>
<tspan x="32" y="818">unresolved.</tspan>
</text>
<text x="32" y="866" font-size="17" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="376">
<tspan x="32" y="866">Illustrative review outcomes.</tspan>
<tspan x="32" y="888">No performance measurement.</tspan>
</text>
</g></svg>