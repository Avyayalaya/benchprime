<svg xmlns="http://www.w3.org/2000/svg" width="440" height="934" viewBox="0 0 440 934" role="img" aria-labelledby="title description">
<title id="title">Useful tests separate variation from failure.</title><desc id="description">Two authored meeting-actions contrasts: changing the wording of a valid task can preserve its acceptability; changing a proposal to an explicit commitment changes the required action. Check the remaining task requirements too.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#17324d"/></marker></defs>
<rect width="440" height="934" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="32" y="52" font-size="29" font-weight="600" fill="#17324d" text-anchor="start" data-max-width="376">
<tspan x="32" y="52">Useful tests separate</tspan>
<tspan x="32" y="89">variation from failure.</tspan>
</text>
<text x="32" y="127" font-size="18" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="376">
<tspan x="32" y="127">Hold the task steady. Change one</tspan>
<tspan x="32" y="150">meaningful thing.</tspan>
</text>
<text x="32" y="215" font-size="24" font-weight="600" fill="#17324d" text-anchor="start" data-max-width="376">
<tspan x="32" y="215">Different wording</tspan>
</text>
<text x="32" y="264" font-size="25" font-weight="400" fill="#17324d" text-anchor="start" data-max-width="376">
<tspan x="32" y="264">Check the cost figures.</tspan>
</text>
<path d="M48 290V327" fill="none" stroke="#17324d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="32" y="369" font-size="25" font-weight="400" fill="#17324d" text-anchor="start" data-max-width="376">
<tspan x="32" y="369">Verify the cost figures.</tspan>
</text>
<text x="32" y="419" font-size="20" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="376">
<tspan x="32" y="419">The same task can be satisfied by</tspan>
<tspan x="32" y="445">either wording.</tspan>
</text>
<path d="M32 508H408" fill="none" stroke="#8b9aa8" stroke-width="1"/>
<text x="32" y="565" font-size="24" font-weight="600" fill="#17324d" text-anchor="start" data-max-width="376">
<tspan x="32" y="565">A different commitment</tspan>
</text>
<text x="32" y="614" font-size="25" font-weight="400" fill="#17324d" text-anchor="start" data-max-width="376">
<tspan x="32" y="614">Could we send it Friday?</tspan>
</text>
<path d="M48 640V677" fill="none" stroke="#17324d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="32" y="719" font-size="25" font-weight="400" fill="#17324d" text-anchor="start" data-max-width="376">
<tspan x="32" y="719">I&#x27;ll send it Friday.</tspan>
</text>
<text x="32" y="769" font-size="20" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="376">
<tspan x="32" y="769">A proposal becomes a commitment.</tspan>
<tspan x="32" y="795">The required action changes.</tspan>
</text>
<path d="M32 839H408" fill="none" stroke="#8b9aa8" stroke-width="1"/>
<text x="32" y="875" font-size="18" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="376">
<tspan x="32" y="875">Authored meeting-actions contrasts.</tspan>
<tspan x="32" y="898">Check the rest of the task too.</tspan>
</text>
</g></svg>