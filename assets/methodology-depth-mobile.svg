<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1900" viewBox="0 0 440 1900" role="img" aria-labelledby="title description">
<title id="title">Follow a capability down to an observable difference</title><desc id="description">Illustrative branches through authority, information and dependencies. Each use case chooses its own dimensions and potential failure mechanisms. Controlled contrasts declare change or invariance; consequential interactions get their own tests.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#17324d"/></marker></defs>
<rect width="440" height="1900" fill="#f5f7f9"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="32" y="55" font-size="28" font-weight="600" fill="#17324d" text-anchor="start" data-max-width="376">
<tspan x="32" y="55">Depth comes from different</tspan>
<tspan x="32" y="91">failure mechanisms.</tspan>
</text>
<text x="32" y="138" font-size="18" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="360">
<tspan x="32" y="138">Illustrative branches. The use case</tspan>
<tspan x="32" y="161">determines which distinctions matter.</tspan>
</text>
<text x="60" y="220" font-size="23" font-weight="600" fill="#17324d" text-anchor="start" data-max-width="340">
<tspan x="60" y="220">A capability that matters</tspan>
</text>
<path d="M38 246V1095" fill="none" stroke="#8b9aa8" stroke-width="2"/>
<path d="M38 308H54" fill="none" stroke="#8b9aa8" stroke-width="2"/>
<circle cx="54" cy="308" r="5" fill="#f5f7f9" stroke="#17324d" stroke-width="2"/>
<text x="70" y="315" font-size="25" font-weight="600" fill="#17324d" text-anchor="start" data-max-width="335">
<tspan x="70" y="315">Authority</tspan>
</text>
<text x="70" y="353" font-size="19" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="330">
<tspan x="70" y="353">Which instruction or source can</tspan>
<tspan x="70" y="377">govern the outcome?</tspan>
</text>
<path d="M62 409V496" fill="none" stroke="#8b9aa8" stroke-width="2"/>
<circle cx="62" cy="430" r="5" fill="#f5f7f9" stroke="#17324d" stroke-width="2"/>
<text x="80" y="437" font-size="20" font-weight="400" fill="#17324d" text-anchor="start" data-max-width="320">
<tspan x="80" y="437">Follows the wrong rule</tspan>
</text>
<circle cx="62" cy="487" r="5" fill="#f5f7f9" stroke="#17324d" stroke-width="2"/>
<text x="80" y="494" font-size="20" font-weight="400" fill="#17324d" text-anchor="start" data-max-width="320">
<tspan x="80" y="494">Treats a preference as an</tspan>
<tspan x="80" y="520">obligation</tspan>
</text>
<text x="70" y="556" font-size="21" font-weight="600" fill="#17324d" text-anchor="start" data-max-width="330">
<tspan x="70" y="556">Hold the rule;</tspan>
<tspan x="70" y="583">vary the source claim.</tspan>
</text>
<text x="70" y="616" font-size="18" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="330">
<tspan x="70" y="616">Separate governing instructions</tspan>
<tspan x="70" y="639">from descriptive evidence.</tspan>
</text>
<path d="M38 688H54" fill="none" stroke="#8b9aa8" stroke-width="2"/>
<circle cx="54" cy="688" r="5" fill="#f5f7f9" stroke="#17324d" stroke-width="2"/>
<text x="70" y="695" font-size="25" font-weight="600" fill="#17324d" text-anchor="start" data-max-width="335">
<tspan x="70" y="695">Information</tspan>
</text>
<text x="70" y="733" font-size="19" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="330">
<tspan x="70" y="733">What can be known from the</tspan>
<tspan x="70" y="757">available evidence?</tspan>
</text>
<path d="M62 789V876" fill="none" stroke="#8b9aa8" stroke-width="2"/>
<circle cx="62" cy="810" r="5" fill="#f5f7f9" stroke="#17324d" stroke-width="2"/>
<text x="80" y="817" font-size="20" font-weight="400" fill="#17324d" text-anchor="start" data-max-width="320">
<tspan x="80" y="817">Invents a missing fact</tspan>
</text>
<circle cx="62" cy="867" r="5" fill="#f5f7f9" stroke="#17324d" stroke-width="2"/>
<text x="80" y="874" font-size="20" font-weight="400" fill="#17324d" text-anchor="start" data-max-width="320">
<tspan x="80" y="874">Flattens conflicting evidence</tspan>
</text>
<text x="70" y="936" font-size="21" font-weight="600" fill="#17324d" text-anchor="start" data-max-width="330">
<tspan x="70" y="936">Hold the question;</tspan>
<tspan x="70" y="963">vary the evidence.</tspan>
</text>
<text x="70" y="996" font-size="18" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="330">
<tspan x="70" y="996">Check whether the strength of the</tspan>
<tspan x="70" y="1019">conclusion remains justified.</tspan>
</text>
<path d="M38 1068H54" fill="none" stroke="#8b9aa8" stroke-width="2"/>
<circle cx="54" cy="1068" r="5" fill="#f5f7f9" stroke="#17324d" stroke-width="2"/>
<text x="70" y="1075" font-size="25" font-weight="600" fill="#17324d" text-anchor="start" data-max-width="335">
<tspan x="70" y="1075">Dependencies</tspan>
</text>
<text x="70" y="1113" font-size="19" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="330">
<tspan x="70" y="1113">What else has to be true for this</tspan>
<tspan x="70" y="1137">outcome to be valid?</tspan>
</text>
<path d="M62 1169V1256" fill="none" stroke="#8b9aa8" stroke-width="2"/>
<circle cx="62" cy="1190" r="5" fill="#f5f7f9" stroke="#17324d" stroke-width="2"/>
<text x="80" y="1197" font-size="20" font-weight="400" fill="#17324d" text-anchor="start" data-max-width="320">
<tspan x="80" y="1197">Skips a prerequisite</tspan>
</text>
<circle cx="62" cy="1247" r="5" fill="#f5f7f9" stroke="#17324d" stroke-width="2"/>
<text x="80" y="1254" font-size="20" font-weight="400" fill="#17324d" text-anchor="start" data-max-width="320">
<tspan x="80" y="1254">Misses combined conditions</tspan>
</text>
<text x="70" y="1316" font-size="21" font-weight="600" fill="#17324d" text-anchor="start" data-max-width="330">
<tspan x="70" y="1316">Hold the goal;</tspan>
<tspan x="70" y="1343">vary a precondition.</tspan>
</text>
<text x="70" y="1376" font-size="18" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="330">
<tspan x="70" y="1376">Check which dependencies change the</tspan>
<tspan x="70" y="1399">valid outcome.</tspan>
</text>
<path d="M32 1446H408" fill="none" stroke="#8b9aa8" stroke-width="2" stroke-dasharray="6 6"/>
<text x="32" y="1485" font-size="21" font-weight="600" fill="#17324d" text-anchor="start" data-max-width="376">
<tspan x="32" y="1485">Also test consequential</tspan>
<tspan x="32" y="1512">combinations across branches.</tspan>
</text>
<rect x="32" y="1570" width="376" height="150" rx="3" fill="#17324d" stroke="#8b9aa8"/>
<text x="52" y="1610" font-size="21" font-weight="600" fill="#ffffff" text-anchor="start" data-max-width="336">
<tspan x="52" y="1610">For each contrast, declare:</tspan>
</text>
<text x="52" y="1653" font-size="21" font-weight="400" fill="#ffffff" text-anchor="start" data-max-width="336">
<tspan x="52" y="1653">Behavior should change</tspan>
</text>
<text x="52" y="1692" font-size="21" font-weight="400" fill="#ffffff" text-anchor="start" data-max-width="336">
<tspan x="52" y="1692">or behavior should stay stable.</tspan>
</text>
<text x="32" y="1770" font-size="18" font-weight="400" fill="#485b6d" text-anchor="start" data-max-width="376">
<tspan x="32" y="1770">Stop when a deeper split repeats a</tspan>
<tspan x="32" y="1793">distinction or cannot be justified with</tspan>
<tspan x="32" y="1816">available evidence. Record the gap.</tspan>
</text>
</g></svg>